spring:
  profiles:
    active: dev
    #active: prod
  application:
    name: data-agent-scope
  autoconfigure:
    exclude:
      - io.agentscope.spring.boot.a2a.AgentscopeA2aAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  datasource:
    url: ${DATA_AGENT_DATASOURCE_URL:jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DATA_AGENT_DATASOURCE_USERNAME:root}
    password: ${DATA_AGENT_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid 连接池配置
    druid:
      initial-size: 5                    # 初始连接数
      min-idle: 5                        # 最小空闲连接数
      max-active: 20                     # 最大活跃连接数
      max-wait: 60000                    # 获取连接最大等待时间（毫秒）
      time-between-eviction-runs-millis: 60000  # 检测间隔（毫秒）
      min-evictable-idle-time-millis: 300000    # 最小空闲时间（毫秒）
      max-evictable-idle-time-millis: 900000    # 最大空闲时间（毫秒）
      validation-query: SELECT 1         # 验证连接有效性
      test-while-idle: true              # 空闲时检测
      test-on-borrow: false              # 借出时检测（影响性能，建议关闭）
      test-on-return: false              # 归还时检测
      pool-prepared-statements: true     # 开启 PSCache
      max-pool-prepared-statement-per-connection-size: 20  # 每个连接 PSCache 大小
      filters: stat,wall                 # 监控统计和 SQL 防火墙
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000  # 慢 SQL 阈值 5 秒
      # WebStatFilter 配置（WebFlux 项目已排除自动配置，此处配置无效）
      web-stat-filter:
        enabled: false                   # WebFlux 不支持 Servlet Filter
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # StatViewServlet 配置（WebFlux 项目已排除自动配置，此处配置无效）
      stat-view-servlet:
        enabled: false                   # WebFlux 不支持 Servlet

# DataAgentScope Web Application Configuration
server:
  port: 58064
  address: 0.0.0.0

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:DataAgentZqsjSecretKey2026ForJWTTokenGeneration}
  internal-api-key: DataAgentInternalKey2026

# Data Agent Management URL
data-agent-management:
  url: ${DATA_AGENT_MANAGEMENT_URL:http://localhost:58065}

# AgentScope Configuration
agentscope:
  # DashScope API Key (set via environment variable: DASHSCOPE_API_KEY)
  api-key: ${DASHSCOPE_API_KEY:sk-26979f34a1a64da2ad4e695b5f4e9d6a}
  # Model name 当前有bug只能使用这种没有版本号的模型名称qwen-max、qwen-plus、qwen-turbo
  model-name: qwen-max
  # Base URL for DashScope API (optional, default is Alibaba Cloud official endpoint)
  base-url: https://dashscope.aliyuncs.com
  # Graceful Shutdown 优雅停机
  shutdown:
    enabled: true
    timeout-seconds: 20
  # HTTP Compression HTTP 压缩
  compression:
    enabled: false

sse:
  timeout-ms: 300000          # SSE 连接超时（5分钟）
  max-concurrent: 100         # 最大并发连接数

heartbeat:
  interval-seconds: 15        # 心跳间隔（需 < sse.timeout-ms/1000）

agent:
  call:
    timeout-seconds: 180      # Agent 调用超时
  hook:
    flush-delay-ms: 100       # Hook 事件刷新延迟（等待流式事件队列）

rag:
  timeout-seconds: 2          # RAG 增强超时

request:
  max-message-length: 4000    # 请求消息最大长度

logging:
  sse:
    fragment:
      sample-rate: 0.1        # 流式片段日志采样率（0.0~1.0）
  level:
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: ERROR  # 忽略静态资源找不到的警告
